# Конфигурация NATS для стека Core.
#
# Секретов в этом файле нет: `$NATS_USER` и `$NATS_PASSWORD` раскрываются самим
# nats-server из окружения контейнера. Значения приходят из compose:
#   * локально — docker-compose.infra.local.yml (dev-значения);
#   * на stage — deploy/.env на сервере (см. deploy/.env.example).
#
# JetStream и порт мониторинга задаются флагами командной строки (`-js -m 8222`)
# в docker-compose.infra.yml, чтобы не менять поведение существующих стендов.

port: 4222

# Шина больше не анонимная: без логина/пароля клиент получает "Authorization Violation".
# Это закрывает возможность отправить любую команду любому сервису, просто дотянувшись
# до порта 4222, и подписаться на чужие ответы.
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
  timeout: 5
}

# TLS обязателен. По шине ходят одноразовые ticket-ы, по которым Identity выпускает
# access token, поэтому открытый трафик внутри overlay-сети — это перехватываемая сессия.
# Без TLS клиент до 4222 просто не договорится.
#
# Сертификат и ключ генерирует deploy/generate-nats-certs.sh (SAN: nats, localhost,
# 127.0.0.1) в deploy/certs/nats, который смонтирован сюда как /etc/nats/certs
# (docker-compose.infra.yml). В git эти файлы не попадают.
#
# `verify: false` — клиентские сертификаты не требуются: клиенты доказывают, кто они,
# логином и паролем выше. Проверка идёт в другую сторону — сервисы .NET сверяют
# сертификат сервера с тем же ca.pem (NatsTlsEnabled=true, NatsTlsCaFile,
# см. Shared.Messaging/Messaging/NatsConnectionFactory.cs).
tls {
  cert_file: "/etc/nats/certs/nats-cert.pem"
  key_file:  "/etc/nats/certs/nats-key.pem"
  ca_file:   "/etc/nats/certs/ca.pem"
  verify:    false
  timeout:   5
}
