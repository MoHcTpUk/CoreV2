# Базовый compose инфраструктуры. Общий для local и stage.
#
# ВАЖНО: в этом файле НЕ публикуются порты (`ports:`) и НЕ хранятся учётные данные.
#   * публикация портов наружу — только в docker-compose.infra.local.yml (локальный стенд);
#     на stage наружу смотрят исключительно 80/443 Traefik (docker-compose.infra.stage.yml);
#   * учётные данные приходят из переменных окружения. Локальные dev-значения лежат
#     в docker-compose.infra.local.yml, значения stage — в deploy/.env на самом сервере
#     (см. deploy/.env.example и README, раздел «Infrastructure credentials»).
services:
  traefik:
    image: traefik:v3.6.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      # Дашборд включён, но НЕ имеет роутера: без него API недостижимо снаружи.
      # `--api.insecure=true` не используется никогда — он отдаёт дашборд без пароля.
      # Чтобы открыть дашборд, добавьте docker-compose.infra.dashboard.yml (basic-auth).
      - "--api.dashboard=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=infra_traefik"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http3=true"
      - "--entryPoints.websecure.http3.advertisedPort=8443"
      - "--providers.file.directory=/certs"
      - "--providers.file.watch=true"
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - traefik

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      # Создание баз identity/users/sample (см. postgres/initdb/10-create-databases.sql).
      # Entrypoint выполняет содержимое каталога ТОЛЬКО при инициализации пустого тома,
      # поэтому на уже существующем postgres_data тот же файл прогоняется вручную —
      # это делает deploy/ensure-databases.sh из start_local.sh / start_stage.sh.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    # Аутентификация задана в ./nats/nats-server.conf: сам файл секретов не содержит,
    # логин/пароль подставляются из $NATS_USER / $NATS_PASSWORD окружения контейнера.
    # Там же включён TLS — порт 4222 не принимает открытых подключений.
    command: ["-c", "/etc/nats/nats-server.conf", "-js", "-m", "8222"]
    environment:
      NATS_USER: ${NATS_USER}
      NATS_PASSWORD: ${NATS_PASSWORD}
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      # Сертификат сервера, его ключ (0600) и корневой сертификат стенда. Создаются один раз
      # скриптом deploy/generate-nats-certs.sh, в git не хранятся. Закрытого ключа CA в каталоге
      # нет. Сервисам приложения монтируется только ca.pem, а не этот каталог.
      - ./certs/nats:/etc/nats/certs:ro
      - nats_data:/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - traefik

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - traefik

volumes:
  postgres_data:
  nats_data:
  minio_data:
  redis_data:

networks:
  traefik:
    name: infra_traefik
    driver: overlay
    attachable: true
