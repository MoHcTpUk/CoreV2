# Portainer. Портов наружу здесь нет: UI публикуется только локальным стендом
# (docker-compose.management.local.yml). На stage Portainer остаётся внутри
# overlay-сети — наружу смотрят только 80/443 Traefik.
services:
  portainer:
    image: portainer/portainer-ce
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
    networks:
      - portainer-net

volumes:
  portainer_data:

networks:
  portainer-net:
    driver: overlay
