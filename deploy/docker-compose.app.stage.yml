# Stage-оверрайд приложения.
#
# Учётные данные инфраструктуры НЕ лежат в appsettings*.json — они приходят сюда
# из окружения (deploy/.env на сервере, шаблон deploy/.env.example) и должны
# совпадать со значениями в docker-compose.infra.stage.yml.
#
# Имена переменных .NET: `__` = разделитель уровней конфигурации,
# `NatsUser` / `NatsPassword` — плоские ключи (Shared.Messaging/NatsConnectionFactory.cs).
services:
  gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Stage
      - NatsUser=${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      - NatsPassword=${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}
      - Minio__AccessKey=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required, see deploy/.env.example}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see deploy/.env.example}
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.gateway.rule=Host(`api.${STAGE_DOMAIN}`)"
        - "traefik.http.routers.gateway.entrypoints=web"
        - "traefik.http.routers.gateway.middlewares=gateway-redirect"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.permanent=true"
        # HTTPS роутер (HTTP/3 включён на entrypoint websecure в Traefik)
        - "traefik.http.routers.gateway-secure.rule=Host(`api.${STAGE_DOMAIN}`)"
        - "traefik.http.routers.gateway-secure.entrypoints=websecure"
        - "traefik.http.routers.gateway-secure.tls=true"
        - "traefik.http.routers.gateway-secure.tls.certresolver=letsencrypt"
        - "traefik.http.services.gateway.loadbalancer.server.port=8080"

  users:
    environment:
      - DOTNET_ENVIRONMENT=Stage
      - NatsUser=${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      - NatsPassword=${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=users;Username=${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}

  sample:
    environment:
      - DOTNET_ENVIRONMENT=Stage
      - NatsUser=${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      - NatsPassword=${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sample;Username=${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}

  identity:
    environment:
      - DOTNET_ENVIRONMENT=Stage
      - NatsUser=${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      - NatsPassword=${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity;Username=${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}

  identity-webapi:
    environment:
      - DOTNET_ENVIRONMENT=Stage
      - NatsUser=${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      - NatsPassword=${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity;Username=${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.identity-webapi.rule=Host(`auth.${STAGE_DOMAIN}`)"
        - "traefik.http.routers.identity-webapi.entrypoints=web"
        - "traefik.http.routers.identity-webapi.middlewares=identity-webapi-redirect"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.identity-webapi-secure.rule=Host(`auth.${STAGE_DOMAIN}`)"
        - "traefik.http.routers.identity-webapi-secure.entrypoints=websecure"
        - "traefik.http.routers.identity-webapi-secure.tls=true"
        - "traefik.http.services.identity-webapi.loadbalancer.server.port=8080"
