# Stage. Наружу публикуются ТОЛЬКО 80 и 443 (Traefik). Ни postgres, ни nats,
# ни minio, ни дашборд Traefik портов наружу не получают: в базовом compose
# `ports:` больше нет, а здесь они не добавляются.
#
# Учётные данные обязательны и берутся из окружения (deploy/.env на сервере,
# см. deploy/.env.example). Если переменная не задана — деплой падает сразу,
# а не поднимает инфраструктуру с пустым паролем.
services:
  traefik:
    command:
      # `command` в override-файле ЗАМЕНЯЕТ список из базового файла целиком,
      # поэтому он повторён полностью. `--api.insecure=true` здесь нет и быть не должно.
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--api.dashboard=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=infra_traefik"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http3"
      - "--entryPoints.websecure.http3.advertisedPort=443"
      - "--certificatesResolvers.letsencrypt.acme.email=oleg.shmatkoff@gmail.com"
      - "--certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.httpChallenge=true"
      - "--certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      - ./traefik/acme.json:/letsencrypt/acme.json

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see deploy/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/.env.example}

  nats:
    environment:
      NATS_USER: ${NATS_USER:?NATS_USER is required, see deploy/.env.example}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required, see deploy/.env.example}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required, see deploy/.env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see deploy/.env.example}
