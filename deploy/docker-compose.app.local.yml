# Локальный стенд, приложение. ЕДИНСТВЕННОЕ место с dev-значениями учётных данных
# для сервисов в docker (профиль Development).
#
# appsettings.json больше не содержит ни логинов, ни паролей: он общий со stage.
# Значения ниже совпадают с dev-значениями в docker-compose.infra.local.yml и
# перебиваются переменными окружения (например через deploy/.env).
#
# Для запуска сервисов из IDE (профиль Local) те же dev-значения лежат
# в appsettings.Local.json.
#
# Каждому сервису монтируется один файл — ./certs/nats/ca.pem: клиент NATS проверяет
# по нему сертификат шины (TLS включён в nats-server.conf). Каталог целиком не монтируется:
# ключ сервера nats-key.pem нужен только контейнеру nats. Сертификаты создаёт
# deploy/generate-nats-certs.sh, start_local.sh вызывает его сам.
services:
  gateway:
    volumes:
      - ./certs/nats/ca.pem:/etc/nats/certs/ca.pem:ro
    environment:
      - NatsUser=${NATS_USER:-core-local}
      - NatsPassword=${NATS_PASSWORD:-core-local-dev-password}
      - Minio__AccessKey=${MINIO_ROOT_USER:-adminadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-adminadmin}

  users:
    volumes:
      - ./certs/nats/ca.pem:/etc/nats/certs/ca.pem:ro
    environment:
      - NatsUser=${NATS_USER:-core-local}
      - NatsPassword=${NATS_PASSWORD:-core-local-dev-password}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=users;Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:-password}

  sample:
    volumes:
      - ./certs/nats/ca.pem:/etc/nats/certs/ca.pem:ro
    environment:
      - NatsUser=${NATS_USER:-core-local}
      - NatsPassword=${NATS_PASSWORD:-core-local-dev-password}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sample;Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:-password}

  identity:
    volumes:
      - ./certs/nats/ca.pem:/etc/nats/certs/ca.pem:ro
    environment:
      - NatsUser=${NATS_USER:-core-local}
      - NatsPassword=${NATS_PASSWORD:-core-local-dev-password}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity;Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:-password}

  identity-webapi:
    volumes:
      - ./certs/nats/ca.pem:/etc/nats/certs/ca.pem:ro
    environment:
      - NatsUser=${NATS_USER:-core-local}
      - NatsPassword=${NATS_PASSWORD:-core-local-dev-password}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity;Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:-password}
